[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dometic-ddmp"
version = "0.1.2"
description = "Local Wi-Fi client for Dometic CFX5 coolers (DDMP v2 / DDM2 protocol): discovery, base64-framed TCP client, topic table, CLI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Mike Lamoureux" }]
keywords = ["dometic", "cfx5", "ddmp", "ddm2", "cooler", "home-automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest~=8.4", "pytest-asyncio~=1.1", "ruff~=0.13"]

[project.scripts]
ddmp = "ddmp.__main__:main"

[project.urls]
Homepage = "https://github.com/mlamoure/dometic-ddmp"

[tool.hatch.build.targets.wheel]
packages = ["src/ddmp"]

[tool.hatch.build.targets.sdist]
include = ["src/ddmp", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
